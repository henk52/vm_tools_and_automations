# ks.cfg — Minimal CentOS Stream 10 kickstart for KVM guest
# Adjust: rootpw, timezone, keyboard, network, disk size / layout as needed.

# --- Installation mode ---
text
# TODO Document.
firstboot --disable
reboot

# --- Locale / keyboard / timezone ---
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Europe/Copenhagen --utc
timesource --ntp-server=pool.ntp.org

# --- Network (DHCP on first virtio NIC; set hostname as desired) ---
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=fedora.local

# --- Root password (change this!) ---
# TODO do the VM creation without root password?
# Generate a hash with:  openssl passwd -6
rootpw --iscrypted CHANGE_ME
# Alternatively use a plain-text password during testing (INSECURE):
# rootpw --plaintext MyP@ssw0rd

# --- Security ---
selinux --enforcing
firewall --enabled --service=ssh

# --- Bootloader ---
bootloader --location=mbr --boot-drive=vda

# --- Disk partitioning (adjust vda if your disk device differs) ---
ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --drives=vda

# UEFI guests: your biosboot layout only works with BIOS. For a layout that handles both BIOS and UEFI, replace the biosboot and /boot lines with reqpart --add-boot.
# Simple LVM layout — tweak sizes to suit
part biosboot   --fstype=biosboot --size=1    --asprimary
# Ubuntu 22 does not understand fedora 44 xfs
#part /boot      --fstype=xfs     --size=1024 --asprimary
part /boot      --fstype=ext4     --size=1024 --asprimary
part pv.01      --fstype=lvmpv   --grow

volgroup cs pv.01
logvol swap  --fstype=swap --name=swap  --vgname=cs --size=1024
#logvol /     --fstype=xfs  --name=root  --vgname=cs --percent=100 --grow
logvol /     --fstype=ext4  --name=root  --vgname=cs --percent=100 --grow

# --- Package selection ---
%packages --inst-langs=en
@^custom-environment
openssh-server
# Optional useful extras:
# bash-completion
# vim-minimal
# chrony
%end

# --- User creation ---
user --name=devops --groups=wheel --shell=/bin/bash --password=SuperSecret --plaintext

# --- Post-install ---
echo "Starting Post-Installation Setup..."
%post --log=/root/ks-post.log

set -euo pipefail

echo "Upgrade all packages"
# Upgrade all packages
dnf upgrade -y

echo "Install extra packages"
# install extra packages
dnf install -y\
  atop\
  btop\
  byobu\
  cloud-init\
  git\
  helix\
  htop\
  neovim\
  rsync\
  tar\
  tmux\
  unzip\
  vim\
  yq\
  zip

# Enable sshd
systemctl enable sshd

# Set up SSH key for devops user
mkdir -p /home/devops/.ssh
chmod 700 /home/devops/.ssh
# the text between the quotes is the public key for the devops user
#   cat vm_devops.pub
echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOKeszFWWwMvE4AnAwbNOV8eoQADtBwtOz6AzfqWTfqc vm-devops-test" > /home/devops/.ssh/authorized_keys
chmod 600 /home/devops/.ssh/authorized_keys
chown -R devops:devops /home/devops/.ssh

echo "clean dnf cache"
# Optional: clean up dnf cache
dnf clean all
%end
